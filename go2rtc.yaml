# ==============================================================================
# go2rtc Configuration — CCTV Video Wall Management System
# ==============================================================================
#
# NVR Dahua: 192.168.1.200
# Port RTSP: 554
#
# Format RTSP Dahua:
#   rtsp://USER:PASS@IP:554/cam/realmonitor?channel=CH&subtype=TYPE
#   subtype=0 → Mainstream (resolusi tinggi, untuk zoom/fullscreen)
#   subtype=1 → Substream  (resolusi rendah, untuk grid monitoring)
#
# PENTING:
#   Pastikan substream NVR dikonfigurasi ke H.264 (bukan H.265)
#   agar go2rtc TIDAK perlu transcode (hemat CPU).
#
# ==============================================================================

# ------------------------------------------------------------------------------
# API & Web Server
# ------------------------------------------------------------------------------
api:
  listen: ":1984"         # Web UI + API di port 1984
  static_dir: "./web"     # Serve file HTML/CSS/JS dari folder ./web

# ------------------------------------------------------------------------------
# WebRTC
# ------------------------------------------------------------------------------
webrtc:
  listen: ":8555"         # WebRTC UDP port

# ------------------------------------------------------------------------------
# Streams — Substream (untuk grid monitoring)
# ------------------------------------------------------------------------------

